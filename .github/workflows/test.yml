name: test
on:
  push:
    branches: ['ci/**']
jobs:
  nose2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt nose2 -e .
      - run: TZ=GMT nose2 -v --log-level CRITICAL
